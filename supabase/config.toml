# Config Supabase locale (supabase start). Ports par défaut de la CLI.
project_id = "pedagoos"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = false

# Fournisseur email ACTIF (connexions par mot de passe) ; l'inscription
# publique reste fermée via [auth].enable_signup — les comptes naissent par
# invitation (admin API). Ne pas remettre enable_signup=false ici : cela
# désactiverait tout le fournisseur email (erreur email_provider_disabled).
[auth.email]
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"
