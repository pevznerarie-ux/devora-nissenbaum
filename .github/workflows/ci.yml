name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check

  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - name: Tests RLS (bloquants)
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_TEST_URL="${API_URL:-${SUPABASE_URL:-http://127.0.0.1:54321}}"
          export SUPABASE_TEST_ANON_KEY="${ANON_KEY:-${SUPABASE_ANON_KEY:-${PUBLISHABLE_KEY:-}}}"
          export SUPABASE_TEST_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-${SECRET_KEY:-}}}"
          echo "url:${SUPABASE_TEST_URL:+ok} anon:${SUPABASE_TEST_ANON_KEY:+ok} service:${SUPABASE_TEST_SERVICE_ROLE_KEY:+ok}"
          RLS_TESTS_REQUIRED=1 pnpm test:rls
